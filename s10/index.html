<script>
/* ===== SESSION CONTENT (original, written for Alexa) ===== */
const TABLE = '<table><tr><th>Wingspan</th><th>Throw 1</th><th>Throw 2</th><th>Throw 3</th></tr><tr><td>10 cm</td><td>3.2 m</td><td>3.6 m</td><td>3.4 m</td></tr><tr><td>15 cm</td><td>5.1 m</td><td>4.8 m</td><td>5.4 m</td></tr><tr><td>20 cm</td><td>4.4 m</td><td>1.2 m ⚠️</td><td>4.6 m</td></tr></table><span class="muted">Same A4 printer paper, same thrower ({Name}), same launch line. ⚠️ On throw 2 of the 20 cm plane, it clipped a {obstacle}.</span>';
const CONFIG = {
  num:10, subject:'Inquiry Lab (early IA)', icon:'🧪', title:'Paper Plane Inquiry',
  introHeading:'Hi {student}! Welcome to the Inquiry Lab ✈️🧪',
  introText:'Real scientists (and IB students doing their Internal Assessments!) start with a great question, plan a fair test, collect data, and draw careful conclusions. Today: paper planes! Do bigger wings really fly further?',

  setupHeading:'Set up the flight test, {student}!',

    {id:'Name', type:'name', label:'Name your test pilot (your partner)', ideas:['Captain Zoom','Ava','Ethan','Wing Commander Wu'], fallback:'Ava', short:'a pilot name', resultLabel:'Test pilot'},

    {id:'place', type:'cards', label:'Where will you test it?', short:'a test place', resultLabel:'Test location',

  ],
  setupGo:'✈️ Ready for take-off!', partTag:'🧪 Inquiry',

  parts:[
    {paras:['You and {Name} set up in {testPlace}. You fold three versions of <b>{plane}</b>, identical except for their <b>wingspan</b>: <b>10 cm</b>, <b>15 cm</b> and <b>20 cm</b>.','"I bet the biggest wings fly furthest," says {Name}. "But a good scientist <i>tests</i> it."'],

      {icon:'🛩️', label:'10 cm (small)', text:'You predict <b>10 cm</b>: small and speedy! You write it down before testing. Scientists always predict first.'},
      {icon:'✈️', label:'15 cm (medium)', text:'You predict <b>15 cm</b>: not too big, not too small! You write it down before testing.'},
      {icon:'🦅', label:'20 cm (large)', text:'You predict <b>20 cm</b>: big wings, big flight! You write it down before testing.'}]}},

  ],
  reference:TABLE,
  questions:[
    {skill:'Research questions', crit:'B', icon:'❓', q:'Which is the <b>best research question</b> for this experiment?',
     opts:[{t:'Are paper planes fun?', fb:'Fun can\u2019t really be measured, and it isn\u2019t about wingspan.'},{t:'Why do planes fly?', fb:'Great curiosity, but far too broad for one experiment.'},{t:'How does wingspan (10, 15, 20 cm) affect how far a paper plane flies?', ok:true, fb:'Excellent! It names what you change (wingspan, with values) and what you measure (distance).'},{t:'Do planes fly?', fb:'That\u2019s a yes/no question with an obvious answer!'}],
     hint:'A strong research question says: How does [the thing I change] affect [the thing I measure]?'},
    {skill:'Research questions', crit:'B', icon:'❓', q:'Why is <i>"What is the best paper plane in the world?"</i> a <b>weak</b> research question?',
     opts:[{t:'It\u2019s too broad and "best" isn\u2019t clearly measurable', ok:true, fb:'Yes! "Best" could mean furthest, longest in the air, prettiest... and "in the world" is impossible to test.'},{t:'It\u2019s too short', fb:'Short questions can be great! The problem is what it asks.'},{t:'It doesn\u2019t mention paper', fb:'It does mention paper planes. Think about measuring "best".'},{t:'It\u2019s too easy to answer', fb:'Actually it\u2019s impossible to answer properly. Why?'}],
     hint:'Could you actually measure "best"? Could you test every plane in the world?'},
    {skill:'Variables', crit:'B', icon:'⚖️', q:'What is the <b>dependent variable</b> (what you measure)?',
     opts:[{t:'The wingspan', fb:'That\u2019s what you <b>change</b>: the independent variable.'},{t:'The type of paper', fb:'That stays the same: a control variable.'},{t:'The person throwing', fb:'That stays the same ({Name} throws every time): a control variable.'},{t:'The distance the plane flies', ok:true, fb:'Correct! You measure distance, and it <i>depends</i> on the wingspan.'}],
     hint:'Dependent = what you MEASURE. What did you use the tape measure for?'},
    {skill:'Variables', crit:'B', icon:'⚖️', q:'Which of these should be <b>controlled</b> (kept the same)?',
     opts:[{t:'The wingspan of each plane', fb:'That\u2019s the one thing we deliberately change.'},{t:'The paper type, the thrower and the launch line', ok:true, fb:'Yes! If these changed too, you wouldn\u2019t know what caused the difference.'},{t:'The distance flown', fb:'That\u2019s what we measure, so it can\u2019t be kept the same!'},{t:'Nothing needs to be kept the same', fb:'Then it wouldn\u2019t be a fair test.'}],
     hint:'In a fair test, you change ONE thing and keep everything else the same.'},
    {skill:'Method & fair testing', crit:'B', icon:'📏', q:'Why did {Name} throw each plane <b>3 times</b>?',
     opts:[{t:'To check the results are consistent and work out an average', ok:true, fb:'Exactly! Repeats show whether results are reliable and help you spot odd ones.'},{t:'Because 3 is a lucky number', fb:'Ha! It\u2019s about reliability, not luck.'},{t:'To make the planes stronger', fb:'Throwing doesn\u2019t strengthen planes. If anything, they get crumpled!'},{t:'To use up more time', fb:'It does take longer, but there\u2019s a scientific reason.'}],
     hint:'If you only threw once and a gust of air hit the plane, would you trust that result?'},
    {skill:'Method & fair testing', crit:'B', icon:'📏', q:'Which step would make the test <b>fairest</b>?',
     opts:[{t:'Let a different person throw each plane', fb:'Different throwers push differently, which is unfair.'},{t:'Throw the 20 cm plane harder because it\u2019s bigger', fb:'That changes two things at once!'},{t:'Measure some throws by counting footsteps', fb:'Footsteps aren\u2019t accurate or consistent. Use the tape measure every time.'},{t:'Launch every throw from behind the same line, at the same height, with the same gentle push', ok:true, fb:'Perfect! Keeping the launch the same means only the wingspan changes.'}],
     hint:'What could make one throw different from another? Keep all of those the same.'},
    {skill:'Data & conclusions', crit:'C', icon:'📊', q:'Which result is an <b>anomaly</b> (a result that doesn\u2019t fit the pattern)?',
     opts:[{t:'3.2 m (10 cm, throw 1)', fb:'3.2 m is close to the other 10 cm results (3.6, 3.4), so it fits.'},{t:'5.4 m (15 cm, throw 3)', fb:'5.4 m is close to 5.1 and 4.8, so it fits.'},{t:'1.2 m (20 cm, throw 2)', ok:true, fb:'Yes! It\u2019s far lower than the other 20 cm throws (4.4, 4.6), and we know it clipped a {obstacle}. Scientists usually leave anomalies out of the average and explain why.'},{t:'There are no anomalies', fb:'Look at the 20 cm row. Is one result very different?'}],

    {skill:'Data & conclusions', crit:'C', icon:'📊', q:'Which <b>conclusion</b> best fits the data?',
     opts:[{t:'The bigger the wings, the further the plane flies', fb:'Check the 20 cm row (about 4.5 m without the anomaly). Is it further than 15 cm (about 5.1 m)?'},{t:'Wingspan makes no difference at all', fb:'10 cm averages about 3.4 m and 15 cm about 5.1 m. That\u2019s a big difference!'},{t:'The 10 cm plane flew furthest', fb:'The 10 cm plane actually flew the shortest distances.'},{t:'Distance increased from 10 cm to 15 cm, then dropped at 20 cm, so bigger isn\u2019t always better', ok:true, fb:'Superb! Averages: 10 cm ≈ 3.4 m, 15 cm ≈ 5.1 m, 20 cm ≈ 4.5 m (without the anomaly). A medium wing worked best, at least for this design.'}],
     hint:'Roughly average each row (ignore the anomaly). Does distance keep going up, or does it change direction?'}
  ],
  written:[
    {id:'myinq', tag:'📝 Your own inquiry', title:'Plan YOUR paper plane inquiry 🧪', skillLabel:'Planning my own inquiry', crit:'B',
     prompt:'Choose a <b>different</b> variable to test (e.g. paper weight, a paperclip on the nose, wing shape, number of folds). Write: <b>(1)</b> a research question: <i>How does ... affect ...?</i> <b>(2)</b> a method in <b>3–5 numbered steps</b> that keeps the test fair.',
     starters:['My research question is: How does... affect...?','1. ','2. ','3. ','I will keep the same...','I will repeat each test...'], minWords:25, sentences:[3,7],
     clueWords:['how does','affect','measure','same','repeat','times','average','fair','1.','2.','3.'], clueLabel:'🧪 Inquiry words spotted',
     placeholder:'My research question is: How does...'}
  ],
  finishHeading:'✈️ Inquiry complete, Scientist {student}! 🎉',
  key:{
    myp:'Sciences B: Inquiring & designing (research questions, variables, method: Q1–6 + the written plan) · C: Processing & evaluating (anomalies, conclusions: Q7–8). This is the **early IA** skills strand: these are the building blocks of every IB Internal Assessment.',
    how:'Alexa names a test pilot and her plane, and chooses where to test it. Her **prediction** (10/15/20 cm) is recorded but not scored. **The data table is fixed**: 10 cm: 3.2/3.6/3.4 m; 15 cm: 5.1/4.8/5.4 m; 20 cm: 4.4/**1.2 (anomaly)**/4.6 m.',
    branches:'Averages for your reference: **10 cm = 3.4 m**, **15 cm = 5.1 m**, **20 cm = 4.5 m without the anomaly** (3.4 m with it). The surprise is that the biggest wings did *not* fly furthest. Talk about why: more drag and weight, and the plane may stall.',
    written:`**The task:** her own research question + a 3–5 step fair method, testing a different variable.

**Model answer (Level 4):**
> *My research question is: How does the number of paperclips on the nose (0, 1, 2, 3) affect how far a paper plane flies?*
> *1. Fold four identical planes from the same A4 printer paper.*
> *2. Add 0, 1, 2 or 3 paperclips to the nose.*
> *3. The same person launches each plane from behind the same line, at shoulder height, with the same gentle push.*
> *4. Measure the distance to where it first touches the floor with a tape measure.*

| Skill | 1 🌱 | 2 🌿 | 3 🌳 | 4 🌟 |
|---|---|---|---|---|
| **Research question** (B) | Missing, or not testable | Testable but vague (no clear measured variable) | "How does X affect Y?" with clear independent and dependent variables | Precise, with the values/range of the independent variable and how Y is measured |

    tips:[

/* ---- scoring & results ---- */
function skillScores(){ const sk={}; QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const s=sk[Q.skill]=sk[Q.skill]||{pts:0,hints:0,correct:0,n:0,icon:Q.icon,crit:Q.crit};

const LEVELS={1:'🌱 Beginning',2:'🌿 Developing',3:'🌳 Secure',4:'🌟 Extending'};
const lvlWord=l=>LEVELS[l]?LEVELS[l].replace(/^\S+ /,''):'';
function setupLines(){ const L=[]; (CONFIG.setup||[]).forEach(it=>{ let v;

  L.push(`${plain(it.resultLabel||it.label)}: ${v}`); }); return L; }
function resultsText(){ const sk=skillScores(), d=new Date(S.started||Date.now()), L=[];
  L.push(`${S.student.toUpperCase()}'S RESULTS · Session ${String(CONFIG.num).padStart(2,'0')} · ${CONFIG.title} (${CONFIG.subject} diagnostic)`);
  L.push(`Date: ${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
  L.push(`Time taken: ${fmt(elapsed())} (target ${fmt(TOTAL_SECONDS)})`);
  L.push(`Stars: ${S.stars}/${QS.length*2} · Questions correct: ${S.answers.filter(a=>a&&a.correct).length}/${QS.length} · Hints used: ${S.hintsUsed}`);
  if((CONFIG.setup||[]).length||PARTS.some(p=>p.choice)){ L.push('','--- MY CHOICES ---'); L.push(...setupLines());
    PARTS.forEach((p,i)=>{ if(p.choice) L.push(`Choice ${i+1}: ${plain(p.choice.q)} -> ${S.choices[i]!=null?plain(p.choice.opts[S.choices[i]].label):'(none)'}`); }); }
  L.push('','--- QUESTIONS ---');
  QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const ans=a.choice!=null?`${'ABCD'[a.choice]}. ${plain(Q.opts[a.choice].t)}`:'(not answered)'; const r=Q.opts.findIndex(o=>o.ok);
    L.push(`Q${i+1} [${Q.skill}] ${a.correct?'CORRECT':'WRONG'}${a.hint?' (hint used)':''} | answered: ${ans}${a.correct?'':` | best answer: ${'ABCD'[r]}`}`); });
  L.push('','--- SKILL SCORES (1-4) ---');
  Object.entries(sk).forEach(([k,v])=>L.push(`${k}${v.crit?' [MYP '+v.crit+']':''}: ${v.level}/4 ${lvlWord(v.level)} (${v.correct}/${v.n} correct, ${v.hints} hint${v.hints===1?'':'s'})`));
  WRITTEN.forEach(W=>{ if(W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false) L.push(`${plain(W.skillLabel||W.title)}${W.crit?' [MYP '+W.crit+']':''}: to be marked by a grown-up, 1-4`); });
  WRITTEN.forEach(W=>{ L.push('',`--- ${plain(W.resultLabel||W.title).toUpperCase()} ---`);
    if(W.type==='ratings'){ W.items.forEach(it=>L.push(`${plain(it.label)}: ${S.ratings[W.id]&&S.ratings[W.id][it.key]||'-'}/4`)); }
    else if(W.type==='pick'){ const o=W.options.find(o=>o.key===S.picks[W.id]); L.push(`Picked: ${o?plain(o.label):'-'}`); if(W.followUp) L.push(`${plain(W.followUp)} ${(S.written[W.id]||'').trim()}`); }
    else { const t=(S.written[W.id]||'').trim(); L.push(t); const c=clues(W,t); L.push(`(${countWords(t)} words, ${countSentences(t)} sentences${W.clueWords?', key words: '+(c.join(', ')||'none'):''}${W.sketch?', sketch drawn: '+(S.sketched[W.id]?'yes (saved separately)':'no'):''})`); } });
  L.push('',`How the quest felt (1-4): ${S.confidence} ${lvlWord(S.confidence)}`);
  return L.join('\n'); }
function finishScreen(){ stopTimer(); setProgress(1); const sk=skillScores(), txt=resultsText();
  const subj=`Session ${String(CONFIG.num).padStart(2,'0')} results: ${S.student} – ${CONFIG.title}`;
  let mailBody=txt; if(mailBody.length>1800) mailBody=Array.from(mailBody).slice(0,1800).join('')+'\n...(cut short - please also paste the full results from "Copy my results")';
  const mail=`mailto:${EMAIL_TO}?cc=${encodeURIComponent(EMAIL_CC)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(mailBody)}`;
  app.innerHTML=`<div class="card"><span class="tag">🏆 Quest complete!</span><h1>${fill(CONFIG.finishHeading||'Amazing work, {student}! 🎉')}</h1>
    <div class="stats"><span>⭐ ${S.stars} / ${QS.length*2} stars</span><span>✅ ${S.answers.filter(a=>a&&a.correct).length} / ${QS.length} correct</span><span>💡 ${S.hintsUsed} hint${S.hintsUsed===1?'':'s'}</span><span>⏱️ ${fmt(elapsed())}</span></div>
    <h2 style="margin-top:18px">Your skill scores</h2>
    ${Object.entries(sk).map(([k,v])=>`<div class="skill"><div class="row"><span>${v.icon||''} ${esc(k)}</span><span>${v.level}/4 · ${LEVELS[v.level]}</span></div><div class="bar"><div class="lvl${v.level}" style="width:${v.level*25}%"></div></div><div class="muted">${v.correct}/${v.n} correct${v.hints?`, ${v.hints} hint${v.hints>1?'s':''} used`:''}</div></div>`).join('')}
    ${WRITTEN.filter(W=>W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false).map(W=>`<div class="skill"><div class="row"><span>📝 ${esc(plain(W.skillLabel||W.title))}</span><span>Grown-up marks this one</span></div><div class="muted">${countWords(S.written[W.id]||'')} words · ${countSentences(S.written[W.id]||'')} sentences</div></div>`).join('')}
    <h2 style="margin-top:18px">📋 Send your results</h2><p>Tap <b>Copy my results</b>, then paste into an email to Mum, or tap <b>Open in email</b>.</p>
    <button class="btn alt" id="copyBtn">📋 Copy my results</button><a class="btn ghost" id="mailBtn" href="${mail}">✉️ Open in email</a><p class="muted" id="copyMsg"></p>
    <pre id="resultText">${esc(txt)}</pre><button class="btn ghost" id="again">🔁 Play again (new choices)</button></div>`;
  window.scrollTo(0,0); burst(innerWidth/2,200);
  $('#copyBtn').onclick=async()=>{ let ok=false; try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
    if(!ok){ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{ok=document.execCommand('copy');}catch(e){} t.remove(); }
    $('#copyMsg').innerHTML=ok?'✅ Copied! Now paste it into an email or message to Mum.':'⚠️ Couldn\u2019t copy automatically. Press and hold the text below, choose "Select all" and then "Copy".'; };
  $('#again').onclick=()=>{ if(confirm('Start again? (Copy your results first!)')) location.reload(); };
}
/* ---- self-test helper (used by automated checks only) ---- */
window.__selfTest=function(){ const bad=new Set(), saved=JSON.stringify(S); const setup=CONFIG.setup||[];
  const combos=[{}]; setup.forEach(it=>{ let vals=[]; if(it.type==='pron') vals=['she','he']; else if(it.type==='cards') vals=it.options.map(o=>o.key).concat(it.custom?['custom']:[]); else vals=['Testname'];
    const n=[]; combos.forEach(c=>vals.forEach(v=>n.push(Object.assign({},c,{[it.id]:v})))); combos.splice(0,combos.length,...n.slice(0,400)); });
  const maxC=Math.max(1,...PARTS.map(p=>p.choice?p.choice.opts.length:1));
  combos.forEach(c=>{ S.setup=c; setup.forEach(it=>{ if(it.type==='cards') S.custom[it.id]='test idea'; });
    QS=getQS(); for(let k=0;k<maxC;k++){ S.choices=PARTS.map(p=>p.choice?Math.min(k,p.choice.opts.length-1):null);
      let all=[CONFIG.storyTitle,CONFIG.reference,CONFIG.setupHeading,CONFIG.finishHeading]; PARTS.forEach(p=>{ all.push(...(p.paras||[]),...(p.after||[]),p.title); if(p.choice){ all.push(p.choice.q); p.choice.opts.forEach(o=>all.push(o.label,o.text)); } });
      QS.forEach(Q=>{ all.push(Q.q,Q.hint,Q.context); Q.opts.forEach(o=>all.push(o.t,o.fb)); }); WRITTEN.forEach(W=>{ all.push(W.skillLabel,W.resultLabel,W.placeholder,W.title,W.prompt,W.context,W.followUp,...(W.starters||[]),...((W.items||[]).map(i=>i.label)),...((W.options||[]).map(o=>o.label))); });
      all.forEach(s=>{ if(s){ const m=fill(s).match(/\{\w+\}/g); if(m) m.forEach(x=>bad.add(x)); } }); } });
  Object.assign(S,JSON.parse(saved));
  const sets=CONFIG.questionSets?Object.values(CONFIG.questionSets):[CONFIG.questions]; const pos=sets.map(qs=>qs.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join('')).join('/'); const multi=[].concat(...sets).filter(Q=>Q.opts.filter(o=>o.ok).length!==1).length; QS=getQS();
  const _unused=QS.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join(''); 
  return {leftover:[...bad], combos:combos.length, positions:pos, badOk:multi}; };
$('#hdrTitle').textContent=`${CONFIG.icon} ${CONFIG.title} · Session ${String(CONFIG.num).padStart(2,'0')}`;
document.title=`Session ${CONFIG.num} · ${CONFIG.title}`;
renderIntro(); updatePills();
</script>
