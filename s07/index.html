/* ===== SESSION CONTENT (original, written for Alexa) ===== */
const INTERVIEW = '<b>🎤 Interview with {Name} (Year 7)</b><br><i>"My school bag is SO heavy that my shoulders hurt by the time I get off the MTR. Last week my water bottle leaked and soaked my maths book. 😩 I can never find my Octopus card at the gate, so there\u2019s always a queue behind me. Oh, and I need space for my {hobbyItem} on {hobbyDay}."</i>';
const CONFIG = {
  num:7, subject:'Design', icon:'🛠️', title:'Fix the School Bag',
  introHeading:'Hi {student}! Calling all designers! 🎒🛠️',
  introText:'A classmate has a school-bag disaster. You\u2019ll run your own design company, interview your client, decide what the bag MUST do, compare ideas, plan how to make it, think about testing, and then sketch your own design.',
  plan:[['🎨 Start your design company','~1 min'],['🎤 Interview your client','~1½ min'],['❓ 8 design questions','~4 min'],['🖍️ Sketch & explain your design','~3 min']],
  setupHeading:'Set up your design studio, {student}!',
  setup:[
    {id:'brand', type:'text', label:'Name your design company', ideas:['Bag Lab','SmartPack Studio','Zip & Go','Alexa Designs'], fallback:'Bag Lab', short:'a company name', resultLabel:'Design company', placeholder:'e.g. Bag Lab'},
    {id:'Name', type:'name', label:'Name your client (a Year 7 classmate)', ideas:['Jayden','Sophie','Ming','Aria','Noah'], fallback:'Jayden', short:'a client name', resultLabel:'Client'},

     options:[{key:'football', icon:'⚽', label:'Football', vars:{hobbyItem:'muddy football boots', hobbyDay:'football days'}},
              {key:'swim', icon:'🏊', label:'Swimming', vars:{hobbyItem:'wet swimming kit', hobbyDay:'swimming days'}},
              {key:'music', icon:'🎻', label:'Music', vars:{hobbyItem:'music books and a recorder', hobbyDay:'music lesson days'}}],
     customVars:t=>({hobbyItem:t+' things', hobbyDay:t+' days'})}
  ],
  setupGo:'🛠️ Open the studio!', partTag:'🛠️ Design studio',
  storyTitle:'{brand}: Our First Client!',
  parts:[
    {paras:['Ding-dong! Your first client walks into <b>{brand}</b>. It\u2019s {Name}, carrying a bulging, droopy school bag.','"Can you help me?" {sub} sighs. You grab your notebook for an interview.','<div class="box">'+INTERVIEW+'</div>'],
     choice:{q:'How do you start your design research?', opts:[

      {icon:'📋', label:'Survey 5 classmates', text:'You ask 5 classmates. 4 out of 5 say their bags hurt their shoulders too. This is a common problem. Useful evidence!'}]},
     after:['Back in the studio, your team sketches two ideas:','<div class="box">💡 <b>Idea 1:</b> wheels, a pull-along handle and one giant compartment.<br>💡 <b>Idea 2:</b> wide padded straps, a waterproof bottle pocket, and a clip-on card holder on the strap.</div>']}
  ],
  reference:INTERVIEW+'<br><br>💡 <b>Idea 1:</b> wheels, a pull-along handle and one giant compartment.<br>💡 <b>Idea 2:</b> wide padded straps, a waterproof bottle pocket, and a clip-on card holder on the strap.',
  questions:[
    {skill:'Inquiring & analysing', crit:'A', icon:'🔎', q:'Which of these is a real <b>user need</b> from {Name}\u2019s interview?',
     opts:[{t:'The bag must be purple', fb:'{Name} never mentioned colour. A user need comes from what the user actually says or shows.'},{t:'The bag must not hurt {pos} shoulders', ok:true, fb:'Yes! "My shoulders hurt" is a clear need straight from the interview.'},{t:'The bag must be very expensive', fb:'Nothing about price was said. Designers shouldn\u2019t invent needs!'},{t:'The bag must have a built-in speaker', fb:'Fun idea, but not something {Name} needs.'}],
     hint:'Re-read the interview. Which option is something {Name} actually complained about?'},
    {skill:'Inquiring & analysing', crit:'A', icon:'🔎', q:'Which question would be <b>most useful</b> to ask {Name} next?',
     opts:[{t:'Do you like bags?', fb:'That\u2019s a yes/no question, so it won\u2019t tell you much about the problem.'},{t:'What\u2019s your favourite colour?', fb:'It could matter later, but it doesn\u2019t help you understand the main problems.'},{t:'Can I keep your bag?', fb:'Ha! You need to understand the problem, not take the bag.'},{t:'What do you carry on a normal day, and how heavy is it?', ok:true, fb:'Excellent! An open question that digs into the cause of the heavy-bag problem.'}],
     hint:'Good research questions are OPEN (not yes/no) and help you understand the CAUSE of the problem.'},
    {skill:'Developing ideas', crit:'B', icon:'📐', q:'Which is the best <b>design specification</b> point (clear and measurable)?',
     opts:[{t:'The empty bag must weigh less than 1 kg', ok:true, fb:'Perfect! It\u2019s specific and you can <b>test</b> it with scales.'},{t:'The bag should be good', fb:'"Good" can\u2019t be measured. How would you test it?'},{t:'The bag must be nice', fb:'"Nice" is an opinion. Specifications need to be testable.'},{t:'Make the bag better', fb:'Better how? A specification says exactly what success looks like.'}],
     hint:'A specification should be testable. Could you check it with a ruler, scales or a timer?'},
    {skill:'Developing ideas', crit:'B', icon:'📐', q:'Which idea better meets <b>all</b> of {Name}\u2019s needs (heavy bag, leaking bottle, lost Octopus card)?',
     opts:[{t:'Idea 1, because wheels are cool', fb:'Wheels help with weight, but what about the leaking bottle and the card?'},{t:'Idea 1, because one giant compartment holds more', fb:'One giant compartment is part of why things get lost and soaked!'},{t:'Idea 2, because it solves all three problems', ok:true, fb:'Yes! Padded straps (shoulders), waterproof pocket (leaks), card holder (Octopus card). Always check ideas against <b>every</b> need.'},{t:'Neither idea helps at all', fb:'Idea 2 actually matches each need. Check them one by one.'}],
     hint:'Make a quick checklist of the 3 needs. Tick which ones each idea solves.'},
    {skill:'Creating the solution', crit:'C', icon:'🧵', q:'Which material is best for the <b>bottle pocket</b>?',
     opts:[{t:'Cotton', fb:'Cotton soaks up water, so the leak would spread.'},{t:'Paper', fb:'Paper would fall apart when wet!'},{t:'Wool', fb:'Wool is warm, but it absorbs water.'},{t:'Waterproof nylon with a sealed lining', ok:true, fb:'Correct! Waterproof nylon keeps leaks inside the pocket and away from the books.'}],
     hint:'The pocket needs to stop water getting out. Which material doesn\u2019t soak up water?'},
    {skill:'Creating the solution', crit:'C', icon:'🧵', q:'Which is the most sensible <b>order</b> for making the prototype (test model)?',
     opts:[{t:'Test it → sew it → measure fabric → cut fabric', fb:'You can\u2019t test something you haven\u2019t made yet!'},{t:'Measure & cut fabric → sew the main parts → add straps & pockets → test it', ok:true, fb:'Great plan! A logical order saves time and materials.'},{t:'Sew it → measure fabric → test it → cut fabric', fb:'You need to measure and cut before you can sew.'},{t:'Add straps → test it → cut fabric → measure', fb:'The straps need a bag to attach to first!'}],
     hint:'Think about it like cooking: prepare ingredients first, then make, then taste.'},
    {skill:'Evaluating', crit:'D', icon:'✅', q:'How should you <b>test</b> whether the new straps meet the need "doesn\u2019t hurt shoulders"?',
     opts:[{t:'Just look at the straps carefully', fb:'Looking can\u2019t tell you about comfort. You need to try it with a real user.'},{t:'Ask your mum if the bag looks nice', fb:'That tests looks, not shoulder comfort.'},{t:'Ask {Name} to wear it with a normal load for a school day and rate comfort, compared with the old bag', ok:true, fb:'Excellent! A real user, real conditions and a comparison: that\u2019s a fair test.'},{t:'Weigh only the straps', fb:'Strap weight alone doesn\u2019t show whether it hurts to wear.'}],
     hint:'The best tests use the REAL user in REAL conditions, and compare with the old design.'},
    {skill:'Evaluating', crit:'D', icon:'✅', q:'Testing shows the bottle pocket <b>still leaks a little</b>. What should a good designer do?',
     opts:[{t:'Record the result, find the cause and improve the design, then test again', ok:true, fb:'Yes! That\u2019s the <b>design cycle</b>: test → evaluate → improve → test again.'},{t:'Ignore it, since it\u2019s only a little leak', fb:'{Name}\u2019s maths book would disagree! Problems found in testing should be fixed.'},{t:'Throw everything away and design a lunchbox instead', fb:'That\u2019s too drastic. Improve the design rather than giving up.'},{t:'Tell {Name} to stop drinking water', fb:'Ha! Designers change the product, not the user\u2019s healthy habits!'}],
     hint:'Designers go round a cycle: inquire → design → create → evaluate → improve...'}
  ],
  written:[
    {id:'design', tag:'🖍️ Your design', title:'Sketch & explain YOUR bag design 🎒', skillLabel:'Explaining my design', crit:'B/D',
     prompt:'Give your design a name. Then, in <b>3–4 sentences</b>, explain <b>at least 2 features</b> and <b>which of {Name}\u2019s needs</b> each one solves (don\u2019t forget the {hobbyItem}!). Add one way you would <b>test</b> it. Sketch it below if you like.',
     starters:['My design is called...','Feature 1 is... which solves...','Feature 2 is... because {Name}...','I would test it by...'], minWords:20, sentences:[3,4],
     clueWords:['because','solves','need','strap','pocket','waterproof','test','weigh','kg','{hobbyItem}'], clueLabel:'🛠️ Design words spotted',
     sketch:true, sketchOpen:true, placeholder:'My design is called...'}
  ],
  finishHeading:'🛠️ {brand} is open for business, {student}! 🎉',
  key:{
    myp:'Design A: Inquiring & analysing (Q1–2) · B: Developing ideas: specifications & choosing ideas (Q3–4) · C: Creating the solution: materials & planning (Q5–6) · D: Evaluating (Q7–8). The written design explanation draws on B and D.',
    how:'Alexa names her design company and client and chooses the client\u2019s hobby (football boots / wet swimming kit / music books / her own idea). The hobby adds one extra need. The interview, the two ideas and all the questions are **fixed**.',
    branches:'The research choice (photograph / weigh / survey) adds a piece of evidence (6.5 kg; 4 of 5 classmates...). It is not scored, but it shows which research method she reaches for first.',
    written:`**The task:** name the design, explain 2+ features linked to needs, add a test, plus an optional sketch.

**Model answer (Level 4), with swimming:**
> *My design is called the AquaPack. Feature 1 is wide padded straps with a chest clip, which solves Jayden's sore shoulders by spreading the weight. Feature 2 is a separate waterproof nylon pocket at the bottom for the water bottle and wet swimming kit, so the books stay dry. Feature 3 is a clip-on card holder on the strap so the Octopus card is always easy to reach. I would test it by asking Jayden to use it for a week and compare how his shoulders feel with the old bag, and by pouring a cup of water into the pocket to check for leaks.*

| Skill | 1 🌱 | 2 🌿 | 3 🌳 | 4 🌟 |
|---|---|---|---|---|
| **Features linked to user needs** (B) | Features listed with no link to needs, or only decoration | 1 feature linked to a need | 2+ features, each clearly linked to a specific need from the interview | All needs addressed, including the hobby item; justified choices of materials |
| **Testing / evaluation thinking** (D) | No test | A vague test ("see if it works") | A specific test linked to a need | A fair, specific test with a user and a comparison/measurement |

/* ---- scoring & results ---- */
function skillScores(){ const sk={}; QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const s=sk[Q.skill]=sk[Q.skill]||{pts:0,hints:0,correct:0,n:0,icon:Q.icon,crit:Q.crit};

const LEVELS={1:'🌱 Beginning',2:'🌿 Developing',3:'🌳 Secure',4:'🌟 Extending'};
const lvlWord=l=>LEVELS[l]?LEVELS[l].replace(/^\S+ /,''):'';
function setupLines(){ const L=[]; (CONFIG.setup||[]).forEach(it=>{ let v;

function resultsText(){ const sk=skillScores(), d=new Date(S.started||Date.now()), L=[];
  L.push(`${S.student.toUpperCase()}'S RESULTS · Session ${String(CONFIG.num).padStart(2,'0')} · ${CONFIG.title} (${CONFIG.subject} diagnostic)`);
  L.push(`Date: ${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
  L.push(`Time taken: ${fmt(elapsed())} (target ${fmt(TOTAL_SECONDS)})`);
  L.push(`Stars: ${S.stars}/${QS.length*2} · Questions correct: ${S.answers.filter(a=>a&&a.correct).length}/${QS.length} · Hints used: ${S.hintsUsed}`);
  if((CONFIG.setup||[]).length||PARTS.some(p=>p.choice)){ L.push('','--- MY CHOICES ---'); L.push(...setupLines());
    PARTS.forEach((p,i)=>{ if(p.choice) L.push(`Choice ${i+1}: ${plain(p.choice.q)} -> ${S.choices[i]!=null?plain(p.choice.opts[S.choices[i]].label):'(none)'}`); }); }
  L.push('','--- QUESTIONS ---');
  QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const ans=a.choice!=null?`${'ABCD'[a.choice]}. ${plain(Q.opts[a.choice].t)}`:'(not answered)'; const r=Q.opts.findIndex(o=>o.ok);
    L.push(`Q${i+1} [${Q.skill}] ${a.correct?'CORRECT':'WRONG'}${a.hint?' (hint used)':''} | answered: ${ans}${a.correct?'':` | best answer: ${'ABCD'[r]}`}`); });
  L.push('','--- SKILL SCORES (1-4) ---');
  Object.entries(sk).forEach(([k,v])=>L.push(`${k}${v.crit?' [MYP '+v.crit+']':''}: ${v.level}/4 ${lvlWord(v.level)} (${v.correct}/${v.n} correct, ${v.hints} hint${v.hints===1?'':'s'})`));
  WRITTEN.forEach(W=>{ if(W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false) L.push(`${plain(W.skillLabel||W.title)}${W.crit?' [MYP '+W.crit+']':''}: to be marked by a grown-up, 1-4`); });
  WRITTEN.forEach(W=>{ L.push('',`--- ${plain(W.resultLabel||W.title).toUpperCase()} ---`);
    if(W.type==='ratings'){ W.items.forEach(it=>L.push(`${plain(it.label)}: ${S.ratings[W.id]&&S.ratings[W.id][it.key]||'-'}/4`)); }
    else if(W.type==='pick'){ const o=W.options.find(o=>o.key===S.picks[W.id]); L.push(`Picked: ${o?plain(o.label):'-'}`); if(W.followUp) L.push(`${plain(W.followUp)} ${(S.written[W.id]||'').trim()}`); }
    else { const t=(S.written[W.id]||'').trim(); L.push(t); const c=clues(W,t); L.push(`(${countWords(t)} words, ${countSentences(t)} sentences${W.clueWords?', key words: '+(c.join(', ')||'none'):''}${W.sketch?', sketch drawn: '+(S.sketched[W.id]?'yes (saved separately)':'no'):''})`); } });
  L.push('',`How the quest felt (1-4): ${S.confidence} ${lvlWord(S.confidence)}`);
  return L.join('\n'); }
function finishScreen(){ stopTimer(); setProgress(1); const sk=skillScores(), txt=resultsText();
  const subj=`Session ${String(CONFIG.num).padStart(2,'0')} results: ${S.student} – ${CONFIG.title}`;
  let mailBody=txt; if(mailBody.length>1800) mailBody=Array.from(mailBody).slice(0,1800).join('')+'\n...(cut short - please also paste the full results from "Copy my results")';
  const mail=`mailto:${EMAIL_TO}?cc=${encodeURIComponent(EMAIL_CC)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(mailBody)}`;
  app.innerHTML=`<div class="card"><span class="tag">🏆 Quest complete!</span><h1>${fill(CONFIG.finishHeading||'Amazing work, {student}! 🎉')}</h1>
    <div class="stats"><span>⭐ ${S.stars} / ${QS.length*2} stars</span><span>✅ ${S.answers.filter(a=>a&&a.correct).length} / ${QS.length} correct</span><span>💡 ${S.hintsUsed} hint${S.hintsUsed===1?'':'s'}</span><span>⏱️ ${fmt(elapsed())}</span></div>
    <h2 style="margin-top:18px">Your skill scores</h2>
    ${Object.entries(sk).map(([k,v])=>`<div class="skill"><div class="row"><span>${v.icon||''} ${esc(k)}</span><span>${v.level}/4 · ${LEVELS[v.level]}</span></div><div class="bar"><div class="lvl${v.level}" style="width:${v.level*25}%"></div></div><div class="muted">${v.correct}/${v.n} correct${v.hints?`, ${v.hints} hint${v.hints>1?'s':''} used`:''}</div></div>`).join('')}
    ${WRITTEN.filter(W=>W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false).map(W=>`<div class="skill"><div class="row"><span>📝 ${esc(plain(W.skillLabel||W.title))}</span><span>Grown-up marks this one</span></div><div class="muted">${countWords(S.written[W.id]||'')} words · ${countSentences(S.written[W.id]||'')} sentences</div></div>`).join('')}
    <h2 style="margin-top:18px">📋 Send your results</h2><p>Tap <b>Copy my results</b>, then paste into an email to Mum, or tap <b>Open in email</b>.</p>
    <button class="btn alt" id="copyBtn">📋 Copy my results</button><a class="btn ghost" id="mailBtn" href="${mail}">✉️ Open in email</a><p class="muted" id="copyMsg"></p>
    <pre id="resultText">${esc(txt)}</pre><button class="btn ghost" id="again">🔁 Play again (new choices)</button></div>`;
  window.scrollTo(0,0); burst(innerWidth/2,200);
  $('#copyBtn').onclick=async()=>{ let ok=false; try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
    if(!ok){ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{ok=document.execCommand('copy');}catch(e){} t.remove(); }
    $('#copyMsg').innerHTML=ok?'✅ Copied! Now paste it into an email or message to Mum.':'⚠️ Couldn\u2019t copy automatically. Press and hold the text below, choose "Select all" and then "Copy".'; };
  $('#again').onclick=()=>{ if(confirm('Start again? (Copy your results first!)')) location.reload(); };
}
/* ---- self-test helper (used by automated checks only) ---- */
window.__selfTest=function(){ const bad=new Set(), saved=JSON.stringify(S); const setup=CONFIG.setup||[];
  const combos=[{}]; setup.forEach(it=>{ let vals=[]; if(it.type==='pron') vals=['she','he']; else if(it.type==='cards') vals=it.options.map(o=>o.key).concat(it.custom?['custom']:[]); else vals=['Testname'];
    const n=[]; combos.forEach(c=>vals.forEach(v=>n.push(Object.assign({},c,{[it.id]:v})))); combos.splice(0,combos.length,...n.slice(0,400)); });
  const maxC=Math.max(1,...PARTS.map(p=>p.choice?p.choice.opts.length:1));
  combos.forEach(c=>{ S.setup=c; setup.forEach(it=>{ if(it.type==='cards') S.custom[it.id]='test idea'; });
    QS=getQS(); for(let k=0;k<maxC;k++){ S.choices=PARTS.map(p=>p.choice?Math.min(k,p.choice.opts.length-1):null);
      let all=[CONFIG.storyTitle,CONFIG.reference,CONFIG.setupHeading,CONFIG.finishHeading]; PARTS.forEach(p=>{ all.push(...(p.paras||[]),...(p.after||[]),p.title); if(p.choice){ all.push(p.choice.q); p.choice.opts.forEach(o=>all.push(o.label,o.text)); } });
      QS.forEach(Q=>{ all.push(Q.q,Q.hint,Q.context); Q.opts.forEach(o=>all.push(o.t,o.fb)); }); WRITTEN.forEach(W=>{ all.push(W.skillLabel,W.resultLabel,W.placeholder,W.title,W.prompt,W.context,W.followUp,...(W.starters||[]),...((W.items||[]).map(i=>i.label)),...((W.options||[]).map(o=>o.label))); });
      all.forEach(s=>{ if(s){ const m=fill(s).match(/\{\w+\}/g); if(m) m.forEach(x=>bad.add(x)); } }); } });
  Object.assign(S,JSON.parse(saved));
  const sets=CONFIG.questionSets?Object.values(CONFIG.questionSets):[CONFIG.questions]; const pos=sets.map(qs=>qs.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join('')).join('/'); const multi=[].concat(...sets).filter(Q=>Q.opts.filter(o=>o.ok).length!==1).length; QS=getQS();
  const _unused=QS.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join(''); 
  return {leftover:[...bad], combos:combos.length, positions:pos, badOk:multi}; };
$('#hdrTitle').textContent=`${CONFIG.icon} ${CONFIG.title} · Session ${String(CONFIG.num).padStart(2,'0')}`;
document.title=`Session ${CONFIG.num} · ${CONFIG.title}`;
renderIntro(); updatePills();
</script>
