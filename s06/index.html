<header><div class="title" id="hdrTitle"></div><div class="pill" id="stars">⭐ 0</div><div class="pill" id="hintsPill">💡 0</div><div class="pill" id="timer">⏱️ 10:00</div></header>

<script>
/* ===== SESSION CONTENT (original, written for Alexa) ===== */
const ART = '<b>🖼️ "Night Market in the Rain"</b> (acrylic paint, invented artist Lam Siu-wai)<br>The background is a deep, inky <b>blue</b>. Strings of glowing <b>orange and red lanterns</b> zig-zag across the top. The street shines with <b>blurry reflections</b> in the puddles. The paint is put on in <b>short, thick brushstrokes</b>, so the surface looks bumpy. Dozens of people are painted as <b>small dark shapes</b> with umbrellas and no faces. Right in the centre is <b>one bright yellow umbrella</b>.';
const CONFIG = {
  num:6, subject:'Arts', icon:'🎨', title:'Feel the Colour',
  introHeading:'Hi {student}! Welcome to the Gallery of Feelings 🎨',
  introText:'Art can make us feel things without a single word. Today you\u2019ll explore a painting with a gallery guide, decode how the artist made it so powerful, then plan (and sketch!) your own artwork.',
  plan:[['🎨 Make it yours','~1 min'],['🖼️ Explore the painting','~2 min'],['❓ 8 art questions','~3½ min'],['🖍️ Plan & sketch your artwork','~3 min']],
  setupHeading:'Get ready for the gallery, {student}!',
  setup:[
    {id:'Name', type:'name', label:'Name your gallery guide', ideas:['Ms. Rivera','Mr. Ho','Coco','Felix','Aunty Mo'], fallback:'Coco', short:'a guide name', resultLabel:'Gallery guide'},
    {id:'pron', type:'pron', label:'Is your guide a...'},
    {id:'colour', type:'cards', label:'Pick your favourite colour today', short:'a colour', resultLabel:'Favourite colour',
     options:[{key:'teal', icon:'🩵', label:'Teal', vars:{colour:'teal'}},{key:'coral', icon:'🪸', label:'Coral pink', vars:{colour:'coral pink'}},{key:'gold', icon:'💛', label:'Gold', vars:{colour:'gold'}},{key:'purple', icon:'💜', label:'Purple', vars:{colour:'purple'}}]},
    {id:'scene', type:'cards', label:'What would YOU like to paint later?', short:'a scene', resultLabel:'My artwork scene', custom:'My own idea', customPlaceholder:'e.g. my cat asleep',
     options:[{key:'skyline', icon:'🌃', label:'Hong Kong skyline', vars:{scene:'the Hong Kong skyline'}},{key:'jungle', icon:'🌴', label:'A jungle', vars:{scene:'a jungle'}},{key:'sea', icon:'🐠', label:'Under the sea', vars:{scene:'an underwater world'}}],
     customVars:t=>({scene:t})}
  ],
  setupGo:'🖼️ Enter the gallery!', partTag:'🖼️ Gallery',
  storyTitle:'The Gallery of Feelings',
  parts:[
    {paras:['{Name} leads you into a quiet room with one big painting on the wall. "Take a slow look," {sub} whispers. "Artists hide clues in every brushstroke."','<div class="box">'+ART+'</div>'],
     choice:{q:'What catches your eye first?', opts:[
      {icon:'🏮', label:'The glowing lanterns', text:'"The lanterns!" you say. {Name} smiles. "Warm colours love to grab attention."'},
      {icon:'☂️', label:'The yellow umbrella', text:'"That yellow umbrella!" you say. {Name} nods. "Interesting. The artist planned that."'},
      {icon:'💧', label:'The shiny puddles', text:'"The reflections in the puddles," you say. {Name} raises an eyebrow. "A detail-spotter! Wonderful."'}]},
     after:['"Now," says {Name}, "let\u2019s decode HOW the artist did it."']}
  ],
  reference:ART,
  questions:[
    {skill:'Art vocabulary', crit:'A', icon:'🔤', q:'The orange and red lanterns are <b>warm</b> colours. Which of these is a <b>cool</b> colour?',
     opts:[{t:'Orange', fb:'Orange is warm, like fire and sunsets.'},{t:'Yellow', fb:'Yellow is warm, like sunshine.'},{t:'Blue', ok:true, fb:'Yes! Blues, greens and purples are cool colours: think water, ice and night sky, like the painting\u2019s background.'},{t:'Red', fb:'Red is the warmest of all!'}],
     hint:'Warm colours remind us of fire and sun. Cool colours remind us of water and ice.'},
    {skill:'Art vocabulary', crit:'A', icon:'🔤', q:'The thick brushstrokes make the paint look <b>bumpy</b>. Which art element describes how a surface looks or feels?',
     opts:[{t:'Texture', ok:true, fb:'Correct! Texture is how something feels, or looks like it would feel: bumpy, smooth, rough.'},{t:'Shape', fb:'Shape is the outline of something (circle, triangle...).'},{t:'Line', fb:'Line is a mark from one point to another.'},{t:'Space', fb:'Space is about distance and the areas around things.'}],
     hint:'If you could touch the painting, what would you be feeling?'},
    {skill:'Composition & technique', crit:'B', icon:'🧭', q:'Your eye goes straight to the bright yellow umbrella in the centre. In art, this is called the...',
     opts:[{t:'background', fb:'The background is the part furthest away, here the dark blue.'},{t:'border', fb:'A border goes around the edge.'},{t:'frame', fb:'The frame is around the outside of the painting.'},{t:'focal point', ok:true, fb:'Yes! The <b>focal point</b> is where the artist wants your eye to land first.'}],
     hint:'It\u2019s the "focus" of the painting. The word starts with "focal..."'},
    {skill:'Composition & technique', crit:'B', icon:'🧭', q:'How did the artist make the yellow umbrella <b>stand out</b> so much?',
     opts:[{t:'By making it the biggest thing in the painting', fb:'It\u2019s only one umbrella among dozens. Size isn\u2019t the trick here.'},{t:'By putting a bright, warm colour against dark, cool colours (contrast)', ok:true, fb:'Exactly! <b>Contrast</b>: bright vs dark, warm vs cool makes things pop.'},{t:'By painting it with no texture', fb:'The description doesn\u2019t say that. Think about its <i>colour</i> compared to what\u2019s around it.'},{t:'By putting it in the corner', fb:'It\u2019s in the centre, not a corner!'}],
     hint:'Compare the colour of the umbrella with the colours around it. Bright or dark? Warm or cool?'},
    {skill:'Responding & interpreting', crit:'D', icon:'💭', q:'What <b>mood</b> does the painting most likely create? (Choose the one with the best evidence.)',
     opts:[{t:'Angry and violent', fb:'Nothing in the painting suggests anger. There are lanterns, umbrellas and a busy market.'},{t:'Bored and dull', fb:'With glowing lanterns and shining puddles, it\u2019s far from dull!'},{t:'Cosy and lively: a busy night out, even in the rain', ok:true, fb:'Great reading! Warm lanterns glowing against the cold blue night feel cosy; dozens of people feel lively. (People can feel art differently. That\u2019s fine, as long as you use evidence!)'},{t:'Empty and lonely', fb:'There are dozens of people, so it\u2019s not empty. Though someone might feel the umbrella person is a little alone in the crowd...'}],
     hint:'Think about what the lanterns, crowd and puddles make you feel. Choose the answer the evidence supports best.'},
    {skill:'Responding & interpreting', crit:'D', icon:'💭', q:'Why might the artist have painted the people as <b>small dark shapes with no faces</b>?',
     opts:[{t:'So we focus on the whole scene and atmosphere, and anyone could imagine being there', ok:true, fb:'Thoughtful! Without faces, the people become part of the atmosphere, and the viewer can imagine themselves in the crowd.'},{t:'Because the artist couldn\u2019t paint faces', fb:'Artists choose simplification on purpose. What effect does it have?'},{t:'Because the people are all sad', fb:'We can\u2019t tell their feelings without faces. That\u2019s part of the point!'},{t:'To make the painting finish faster', fb:'Maybe, but think about the <i>effect</i> on the viewer.'}],
     hint:'If every person had a detailed face, where would you look? What happens without faces?'},
    {skill:'Creative thinking', crit:'C', icon:'💡', q:'You want to repaint this scene to feel <b>calm and peaceful</b>. Which change would work best?',
     opts:[{t:'Add more bright red and lots of zig-zag lines', fb:'Bright red and zig-zags usually feel energetic or tense, not calm.'},{t:'Add a storm with lightning', fb:'Lightning adds drama, the opposite of peaceful!'},{t:'Make the brushstrokes even thicker and messier', fb:'That would feel more energetic. Calm usually means smoother strokes.'},{t:'Use soft, cool colours (pale blue, lilac), smooth strokes and fewer people', ok:true, fb:'Yes! Soft cool colours, smooth strokes and empty space create calm.'}],
     hint:'What colours, lines and amount of "busy-ness" make YOU feel calm?'},
    {skill:'Creative thinking', crit:'C', icon:'💡', q:'A composer is writing <b>music</b> to go with the painting. Which idea fits best?',
     opts:[{t:'A loud marching band with crashing cymbals', fb:'That\u2019s more of a parade than a rainy night market.'},{t:'Gentle plinking notes like raindrops, with a cheerful, bustling tune underneath', ok:true, fb:'Lovely! Raindrop sounds match the rain; a bustling tune matches the busy, cosy market.'},{t:'Complete silence', fb:'Silence could work as a bold idea, but it doesn\u2019t match the lively crowd.'},{t:'A slow, sad song about winter', fb:'The painting feels warm and lively more than sad.'}],
     hint:'Match the music to two things in the painting: the rain AND the busy, glowing market.'}
  ],
  written:[
    {id:'plan', tag:'🖍️ Your artwork', title:'Plan your own artwork: {scene}! 🎨', skillLabel:'Planning my artwork', crit:'B/C',
     prompt:'Plan an artwork of <b>{scene}</b> using your favourite colour, <b>{colour}</b>. In <b>3–4 sentences</b>, say: what <b>mood</b> you want, which <b>colours</b> you\u2019ll use and why, where your <b>focal point</b> will be, and one <b>technique</b> (e.g. thick brushstrokes, contrast, texture). Then do a quick sketch if you like!',
     starters:['My artwork shows...','I want the mood to feel...','I will use {colour} for...','The focal point will be...','To make it stand out, I will...'], minWords:15, sentences:[3,4],
     clueWords:['mood','focal point','contrast','warm','cool','texture','brushstroke','line','{colour}','because'], clueLabel:'🎨 Art words spotted',
     sketch:true, sketchOpen:true, placeholder:'My artwork shows...'}
  ],
  finishHeading:'🎨 What an artist you are, {student}! 🎉',
  key:{
    myp:'Arts A: Investigating (art vocabulary, Q1–2) · B: Developing skills (composition & technique, Q3–4) · C: Thinking creatively (Q7–8 + the artwork plan) · D: Responding (interpreting mood and meaning, Q5–6).',
    how:'Alexa names a gallery guide, picks a favourite colour and a scene for her own artwork (skyline / jungle / under the sea / her own idea). The painting is **fixed**. It is an invented, described artwork, *Night Market in the Rain*. She can draw on a built-in **sketch pad** (finger or mouse) and save it as a picture. The sketch is not included in the copied text, so ask her to send the saved image or show you.',
    branches:'"What catches your eye first?" (lanterns / umbrella / puddles) is not scored. It is a nice clue to what she notices: colour, focal point or detail.',
    written:`**The task:** plan her own artwork (mood, colours, focal point, technique), plus an optional sketch.

**Model answer (Level 4), Hong Kong skyline in teal:**
> *My artwork shows the Hong Kong skyline at dawn, and I want the mood to feel calm and hopeful. I will use teal and pale pink for the sky because cool colours feel peaceful, with a soft warm glow behind the buildings. The focal point will be one small orange window lit up in the tallest tower, which will stand out because of the contrast with the cool colours around it. I will use smooth, blended brushstrokes for the sky and sharp straight lines for the buildings.*

| Skill | 1 🌱 | 2 🌿 | 3 🌳 | 4 🌟 |
|---|---|---|---|---|
| **Creative intention** (C) | No clear idea or mood | Names a subject, but mood/choices are vague | Clear mood, with colour choices linked to it | Original idea; choices are deliberate and justified ("because...") |
| **Use of art language & techniques** (A/B) | No art vocabulary | 1 art word used loosely | Uses 2+ terms correctly (focal point, contrast, warm/cool, texture) | Uses terms precisely and explains *how* the technique creates the effect |

const EMAIL_TO='Doris.s.chiu@gmail.com', EMAIL_CC='francoisdemange@hotmail.com';
const TOTAL_SECONDS = CONFIG.seconds || 600;
const PRONOUNS={she:{sub:'she',obj:'her',pos:'her'},he:{sub:'he',obj:'him',pos:'his'}};

function tokens(){

function fill(str){ if(str==null) return ''; const T=tokens(); let out=String(str);

  else{el.textContent='⏱️ +'+fmt(left)+' extra';el.className='pill over'; if(!timeUpShown){timeUpShown=true;toast('⏰ 10 minutes are up! Finish the bit you\u2019re on, then head to the end. No rush! 😊',4500);}}}

/* ---- written / creative / ratings ---- */
function countSentences(t){ t=t.trim(); if(!t) return 0; return (t.match(/[^.!?。！？]+[.!?。！？]+/g)||[]).filter(s=>s.trim().length>1).length + (/[^.!?。！？\s]\s*$/.test(t)?1:0); }

/* ---- scoring & results ---- */
function skillScores(){ const sk={}; QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const s=sk[Q.skill]=sk[Q.skill]||{pts:0,hints:0,correct:0,n:0,icon:Q.icon,crit:Q.crit};

const LEVELS={1:'🌱 Beginning',2:'🌿 Developing',3:'🌳 Secure',4:'🌟 Extending'};
const lvlWord=l=>LEVELS[l]?LEVELS[l].replace(/^\S+ /,''):'';
function setupLines(){ const L=[]; (CONFIG.setup||[]).forEach(it=>{ let v;
  if(it.type==='pron') v=S.setup[it.id]==='he'?'boy (he/him)':'girl (she/her)';
  else if(it.type==='cards'){ const o=optFor(it); v=o?o.label+(S.setup[it.id]==='custom'?' (own idea)':''):'-'; }

function resultsText(){ const sk=skillScores(), d=new Date(S.started||Date.now()), L=[];

  L.push(`Date: ${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
  L.push(`Time taken: ${fmt(elapsed())} (target ${fmt(TOTAL_SECONDS)})`);
  L.push(`Stars: ${S.stars}/${QS.length*2} · Questions correct: ${S.answers.filter(a=>a&&a.correct).length}/${QS.length} · Hints used: ${S.hintsUsed}`);
  if((CONFIG.setup||[]).length||PARTS.some(p=>p.choice)){ L.push('','--- MY CHOICES ---'); L.push(...setupLines());
    PARTS.forEach((p,i)=>{ if(p.choice) L.push(`Choice ${i+1}: ${plain(p.choice.q)} -> ${S.choices[i]!=null?plain(p.choice.opts[S.choices[i]].label):'(none)'}`); }); }
  L.push('','--- QUESTIONS ---');
  QS.forEach((Q,i)=>{ const a=S.answers[i]||{}; const ans=a.choice!=null?`${'ABCD'[a.choice]}. ${plain(Q.opts[a.choice].t)}`:'(not answered)'; const r=Q.opts.findIndex(o=>o.ok);
    L.push(`Q${i+1} [${Q.skill}] ${a.correct?'CORRECT':'WRONG'}${a.hint?' (hint used)':''} | answered: ${ans}${a.correct?'':` | best answer: ${'ABCD'[r]}`}`); });
  L.push('','--- SKILL SCORES (1-4) ---');
  Object.entries(sk).forEach(([k,v])=>L.push(`${k}${v.crit?' [MYP '+v.crit+']':''}: ${v.level}/4 ${lvlWord(v.level)} (${v.correct}/${v.n} correct, ${v.hints} hint${v.hints===1?'':'s'})`));
  WRITTEN.forEach(W=>{ if(W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false) L.push(`${plain(W.skillLabel||W.title)}${W.crit?' [MYP '+W.crit+']':''}: to be marked by a grown-up, 1-4`); });
  WRITTEN.forEach(W=>{ L.push('',`--- ${plain(W.resultLabel||W.title).toUpperCase()} ---`);
    if(W.type==='ratings'){ W.items.forEach(it=>L.push(`${plain(it.label)}: ${S.ratings[W.id]&&S.ratings[W.id][it.key]||'-'}/4`)); }
    else if(W.type==='pick'){ const o=W.options.find(o=>o.key===S.picks[W.id]); L.push(`Picked: ${o?plain(o.label):'-'}`); if(W.followUp) L.push(`${plain(W.followUp)} ${(S.written[W.id]||'').trim()}`); }
    else { const t=(S.written[W.id]||'').trim(); L.push(t); const c=clues(W,t); L.push(`(${countWords(t)} words, ${countSentences(t)} sentences${W.clueWords?', key words: '+(c.join(', ')||'none'):''}${W.sketch?', sketch drawn: '+(S.sketched[W.id]?'yes (saved separately)':'no'):''})`); } });
  L.push('',`How the quest felt (1-4): ${S.confidence} ${lvlWord(S.confidence)}`);
  return L.join('\n'); }
function finishScreen(){ stopTimer(); setProgress(1); const sk=skillScores(), txt=resultsText();
  const subj=`Session ${String(CONFIG.num).padStart(2,'0')} results: ${S.student} – ${CONFIG.title}`;
  let mailBody=txt; if(mailBody.length>1800) mailBody=Array.from(mailBody).slice(0,1800).join('')+'\n...(cut short - please also paste the full results from "Copy my results")';
  const mail=`mailto:${EMAIL_TO}?cc=${encodeURIComponent(EMAIL_CC)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(mailBody)}`;
  app.innerHTML=`<div class="card"><span class="tag">🏆 Quest complete!</span><h1>${fill(CONFIG.finishHeading||'Amazing work, {student}! 🎉')}</h1>
    <div class="stats"><span>⭐ ${S.stars} / ${QS.length*2} stars</span><span>✅ ${S.answers.filter(a=>a&&a.correct).length} / ${QS.length} correct</span><span>💡 ${S.hintsUsed} hint${S.hintsUsed===1?'':'s'}</span><span>⏱️ ${fmt(elapsed())}</span></div>
    <h2 style="margin-top:18px">Your skill scores</h2>
    ${Object.entries(sk).map(([k,v])=>`<div class="skill"><div class="row"><span>${v.icon||''} ${esc(k)}</span><span>${v.level}/4 · ${LEVELS[v.level]}</span></div><div class="bar"><div class="lvl${v.level}" style="width:${v.level*25}%"></div></div><div class="muted">${v.correct}/${v.n} correct${v.hints?`, ${v.hints} hint${v.hints>1?'s':''} used`:''}</div></div>`).join('')}
    ${WRITTEN.filter(W=>W.type!=='ratings'&&W.type!=='pick'&&W.marked!==false).map(W=>`<div class="skill"><div class="row"><span>📝 ${esc(plain(W.skillLabel||W.title))}</span><span>Grown-up marks this one</span></div><div class="muted">${countWords(S.written[W.id]||'')} words · ${countSentences(S.written[W.id]||'')} sentences</div></div>`).join('')}
    <h2 style="margin-top:18px">📋 Send your results</h2><p>Tap <b>Copy my results</b>, then paste into an email to Mum, or tap <b>Open in email</b>.</p>
    <button class="btn alt" id="copyBtn">📋 Copy my results</button><a class="btn ghost" id="mailBtn" href="${mail}">✉️ Open in email</a><p class="muted" id="copyMsg"></p>
    <pre id="resultText">${esc(txt)}</pre><button class="btn ghost" id="again">🔁 Play again (new choices)</button></div>`;
  window.scrollTo(0,0); burst(innerWidth/2,200);
  $('#copyBtn').onclick=async()=>{ let ok=false; try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
    if(!ok){ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{ok=document.execCommand('copy');}catch(e){} t.remove(); }
    $('#copyMsg').innerHTML=ok?'✅ Copied! Now paste it into an email or message to Mum.':'⚠️ Couldn\u2019t copy automatically. Press and hold the text below, choose "Select all" and then "Copy".'; };
  $('#again').onclick=()=>{ if(confirm('Start again? (Copy your results first!)')) location.reload(); };
}
/* ---- self-test helper (used by automated checks only) ---- */
window.__selfTest=function(){ const bad=new Set(), saved=JSON.stringify(S); const setup=CONFIG.setup||[];
  const combos=[{}]; setup.forEach(it=>{ let vals=[]; if(it.type==='pron') vals=['she','he']; else if(it.type==='cards') vals=it.options.map(o=>o.key).concat(it.custom?['custom']:[]); else vals=['Testname'];
    const n=[]; combos.forEach(c=>vals.forEach(v=>n.push(Object.assign({},c,{[it.id]:v})))); combos.splice(0,combos.length,...n.slice(0,400)); });
  const maxC=Math.max(1,...PARTS.map(p=>p.choice?p.choice.opts.length:1));
  combos.forEach(c=>{ S.setup=c; setup.forEach(it=>{ if(it.type==='cards') S.custom[it.id]='test idea'; });
    QS=getQS(); for(let k=0;k<maxC;k++){ S.choices=PARTS.map(p=>p.choice?Math.min(k,p.choice.opts.length-1):null);
      let all=[CONFIG.storyTitle,CONFIG.reference,CONFIG.setupHeading,CONFIG.finishHeading]; PARTS.forEach(p=>{ all.push(...(p.paras||[]),...(p.after||[]),p.title); if(p.choice){ all.push(p.choice.q); p.choice.opts.forEach(o=>all.push(o.label,o.text)); } });
      QS.forEach(Q=>{ all.push(Q.q,Q.hint,Q.context); Q.opts.forEach(o=>all.push(o.t,o.fb)); }); WRITTEN.forEach(W=>{ all.push(W.skillLabel,W.resultLabel,W.placeholder,W.title,W.prompt,W.context,W.followUp,...(W.starters||[]),...((W.items||[]).map(i=>i.label)),...((W.options||[]).map(o=>o.label))); });
      all.forEach(s=>{ if(s){ const m=fill(s).match(/\{\w+\}/g); if(m) m.forEach(x=>bad.add(x)); } }); } });
  Object.assign(S,JSON.parse(saved));
  const sets=CONFIG.questionSets?Object.values(CONFIG.questionSets):[CONFIG.questions]; const pos=sets.map(qs=>qs.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join('')).join('/'); const multi=[].concat(...sets).filter(Q=>Q.opts.filter(o=>o.ok).length!==1).length; QS=getQS();
  const _unused=QS.map(Q=>'ABCD'[Q.opts.findIndex(o=>o.ok)]).join(''); 
  return {leftover:[...bad], combos:combos.length, positions:pos, badOk:multi}; };
$('#hdrTitle').textContent=`${CONFIG.icon} ${CONFIG.title} · Session ${String(CONFIG.num).padStart(2,'0')}`;
document.title=`Session ${CONFIG.num} · ${CONFIG.title}`;
renderIntro(); updatePills();
</script>
